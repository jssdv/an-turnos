services:
  db:
    image: postgres:16
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_USER: an
      POSTGRES_PASSWORD: an_dev
      POSTGRES_DB: an
    volumes:
      - an_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U an -d an"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  an_pg:
