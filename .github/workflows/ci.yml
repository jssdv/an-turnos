name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  nucleo:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
      # Scripts sin funciones test_*; los de GUI y nucleo piden bibliotecas de Qt que el runner no trae.
      - run: python tests/radiologia/test_generar_semana.py
