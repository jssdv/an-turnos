name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  nucleo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-web.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-web.txt
      - run: python checks/tokens.py --verificar
      - run: python checks/reglas.py
      - run: python -m pytest tests -q
        env:
          AN_TIEMPO_ESCALA: "3"
      # Script sin funciones test_*.
      - run: python tests/radiologia/test_generar_semana.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python checks/diseno.py
        working-directory: .
