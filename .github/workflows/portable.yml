name: Portable Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [fase-4-paridad-pc]  # temporal: probar el build antes de fusionar a main

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd web; npm ci; npm run build
      - run: pip install -r requirements.txt -r requirements-web.txt pgserver pyinstaller
      - name: Empaquetar
        run: >-
          pyinstaller deploy/lanzar.py --noconfirm --name An --onedir
          --add-data "web/dist;web_dist"
          --add-data "an/web/migraciones;an/web/migraciones"
          --collect-all pgserver --collect-all ortools --collect-all psycopg_binary
          --collect-submodules uvicorn --collect-submodules an
      - name: Prueba de humo (arranca, sirve el front y la API)
        shell: pwsh
        run: |
          $env:AN_DATOS = "$env:RUNNER_TEMP\an_datos"
          $p = Start-Process dist/An/An.exe -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep 2
            try { Invoke-WebRequest http://localhost:8765/api/areas -UseBasicParsing | Out-Null } catch { if ($_.Exception.Response.StatusCode -eq 401) { $ok = $true; break } }
          }
          Stop-Process $p -Force
          if (-not $ok) { throw "El ejecutable no respondió" }
      - run: Compress-Archive dist/An An-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: An-windows
          path: An-windows.zip
